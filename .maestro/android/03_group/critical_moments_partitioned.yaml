appId: com.example.momentra
tags: [critical, android, group, finance, multicurrency]
---
# After EQUAL expense, Moments shows Total spent + Your share (no invented per-person equal math)
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_GROUP_OWNER_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_GROUP_OWNER_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 60000
- tapOn:
    id: "context.group"
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Expense"
    commands:
      - tapOn: "Expense"
- extendedWaitUntil:
    visible:
      id: "group.expense.amount"
    timeout: 20000
- tapOn:
    id: "group.expense.note"
- eraseText
- inputText: "MAESTRO-PART-${MAESTRO_RUN_ID}"
- tapOn:
    id: "group.expense.amount"
- eraseText
- inputText: "88.00"
- runFlow:
    when:
      visible:
        id: "group.expense.split.equal"
    commands:
      - tapOn:
          id: "group.expense.split.equal"
- tapOn:
    id: "group.expense.submit"
- extendedWaitUntil:
    notVisible:
      id: "group.expense.submit"
    timeout: 45000
- tapOn:
    id: "bottom.moments"
- extendedWaitUntil:
    visible: "Total spent"
    timeout: 30000
- assertVisible: "Total spent"
- assertVisible: "Your share"
- assertNotVisible: "Per-person split"
- takeScreenshot: android_group_moments_partitioned
