# Generated by generate-input-flows.ts — do not hand-edit
# rows=50 first=MTR-IOS-3003 last=MTR-IOS-3150
# Login baked from .env.maestro.local so Maestro Studio works without -e
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding.skip"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Step Inside"
    commands:
      - tapOn: "Step Inside"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.ios.business.owner@test.com"
# Gboard first-run "Try out your stylus" coachmark covers password after wipe/cold boot.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.business"
# MTR-IOS-3003 Business/Business Operations/Software join=JOINED
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Log Spend Entry"
    commands:
      - tapOn: "Log Spend Entry"
- runFlow:
    when:
      visible:
        id: "business.expense.note"
    commands:
      - tapOn:
          id: "business.expense.note"
      - eraseText
      - inputText: "MAESTRO-IOS-BUSINESS-BUSINESS_OPERATIONS-3003 | Software | 22456.06"
- runFlow:
    when:
      visible:
        id: "business.expense.amount"
    commands:
      - tapOn:
          id: "business.expense.amount"
      - eraseText
      - inputText: "22456.06"
- runFlow:
    when:
      visible:
        id: "business.expense.submit"
    commands:
      - tapOn:
          id: "business.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "business.expense.submit"
          timeout: 45000
# Never unconditional back — exits the app to launcher on Android.
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-IOS-BUSINESS-BUSINESS_OPERATIONS"
