    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Team Update"
    commands:
      - tapOn: "Team Update"
- runFlow:
    when:
      visible:
        id: "business.expense.note"
    commands:
      - tapOn:
          id: "business.expense.note"
      - eraseText
      - inputText: "MAESTRO-IOS-BUSINESS-TEAM_OPERATIONS-1908 | Training | 54809.42"
- runFlow:
    when:
      visible:
        id: "business.expense.amount"
    commands:
      - tapOn:
          id: "business.expense.amount"
      - eraseText
      - inputText: "54809.42"
- runFlow:
    when:
      visible:
        id: "business.expense.submit"
    commands:
      - tapOn:
          id: "business.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "business.expense.submit"
          timeout: 45000
- back
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-IOS-BUSINESS-TEAM_OPERATIONS-190"
    commands:
      - assertVisible: "MAESTRO-IOS-BUSINESS-TEAM_OPERATIONS-190"
- tapOn:
    id: "bottom.pulse"

