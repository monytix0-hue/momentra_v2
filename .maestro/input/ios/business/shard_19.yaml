- runFlow:
    when:
      visible:
        id: "business.expense.submit"
    commands:
      - tapOn:
          id: "business.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "business.expense.submit"
          timeout: 45000
# Never unconditional back — exits the app to launcher on Android.
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 60000
