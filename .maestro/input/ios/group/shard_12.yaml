      visible:
        id: "group.expense.note"
    commands:
      - tapOn:
          id: "group.expense.note"
      - eraseText
      - inputText: "MAESTRO-IOS-GROUP-GIFT_POOL-1820 | Delivery | 23524.32"
- runFlow:
    when:
      visible:
        id: "group.expense.amount"
    commands:
      - tapOn:
          id: "group.expense.amount"
      - eraseText
      - inputText: "23524.32"
- runFlow:
    when:
      visible:
        id: "group.expense.submit"
    commands:
      - tapOn:
          id: "group.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "group.expense.submit"
          timeout: 45000
- back
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-IOS-GROUP-GIFT_POOL-1820 | Deliv"
    commands:
      - assertVisible: "MAESTRO-IOS-GROUP-GIFT_POOL-1820 | Deliv"
- tapOn:
    id: "bottom.pulse"

