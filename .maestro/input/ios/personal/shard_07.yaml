      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.ios.personal@test.com"
# Gboard first-run "Try out your stylus" coachmark covers password after wipe/cold boot.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.personal"
