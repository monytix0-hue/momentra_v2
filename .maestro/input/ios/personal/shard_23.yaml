      visible:
        id: "personal.income.amount"
    commands:
      - tapOn:
          id: "personal.income.amount"
      - eraseText
      - inputText: "2019.01"
- runFlow:
    when:
      visible:
        id: "personal.income.submit"
    commands:
      - tapOn:
          id: "personal.income.submit"
      - extendedWaitUntil:
          notVisible:
            id: "personal.income.submit"
          timeout: 45000
# Never unconditional back — exits the app to launcher on Android.
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
