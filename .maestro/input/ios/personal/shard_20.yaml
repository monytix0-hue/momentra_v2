      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.personal"
