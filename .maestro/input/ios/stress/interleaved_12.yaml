- extendedWaitUntil:
    visible:
      id: "onboarding.skip"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Step Inside"
    commands:
      - tapOn: "Step Inside"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.ios.business.owner@test.com"
# Gboard first-run "Try out your stylus" coachmark covers password after wipe/cold boot.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.business"

# MTR-IOS-0603 Business/Business Runway/Loan join=JOINED
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible:
        id: "qa.tile.revenue"
    commands:
      - tapOn:
          id: "qa.tile.revenue"
- runFlow:
    when:
      visible: "Log Revenue"
    commands:
      - tapOn: "Log Revenue"
- runFlow:
    when:
      visible:
        id: "business.revenue.amount"
    commands:
      - tapOn:
          id: "business.revenue.amount"
      - eraseText
      - inputText: "26296.26"
- runFlow:
    when:
      visible:
        id: "business.revenue.submit"
    commands:
      - tapOn:
          id: "business.revenue.submit"
      - extendedWaitUntil:
          notVisible:
            id: "business.revenue.submit"
          timeout: 45000
# Never unconditional back — exits the app to launcher on Android.
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-IOS-BUSINESS-BUSINESS_RUNWAY-060"
    commands:
      - assertVisible: "MAESTRO-IOS-BUSINESS-BUSINESS_RUNWAY-060"
- tapOn:
    id: "bottom.pulse"

- takeScreenshot: stress_12_done
