          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.ios.personal@test.com"
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
