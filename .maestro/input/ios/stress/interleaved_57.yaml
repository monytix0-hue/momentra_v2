# Stress shard 57 — interleaved P/G/B (50 writable rows)
# Hard gate: pilot PASS required before running stress at scale

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding.skip"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
