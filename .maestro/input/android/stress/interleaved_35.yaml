      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.apk.group.owner@test.com"
# Gboard first-run "Try out your stylus" coachmark covers password after wipe/cold boot.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.group"

# MTR-APK-1760 Group/Trip/Other join=JOINED
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible:
        id: "qa.tile.expense"
    commands:
      - tapOn:
          id: "qa.tile.expense"
- runFlow:
    when:
      visible: "Expense"
    commands:
      - tapOn: "Expense"
- runFlow:
    when:
      visible:
        id: "group.expense.category"
    commands:
      - tapOn: "Other"
- runFlow:
    when:
      visible:
        id: "group.expense.split.exact"
    commands:
      - tapOn:
          id: "group.expense.split.exact"
- runFlow:
    when:
      visible:
        id: "group.expense.note"
    commands:
      - tapOn:
          id: "group.expense.note"
      - eraseText
      - inputText: "MAESTRO-APK-GROUP-TRIP-1760 | Other | 12976.47"
- runFlow:
    when:
      visible:
        id: "group.expense.amount"
    commands:
      - tapOn:
          id: "group.expense.amount"
      - eraseText
      - inputText: "12976.47"
- runFlow:
    when:
      visible:
        id: "group.expense.submit"
    commands:
      - tapOn:
          id: "group.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "group.expense.submit"
          timeout: 45000
# Never unconditional back — exits the app to launcher on Android.
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-APK-GROUP-TRIP-1760 | Other | 12"
    commands:
      - assertVisible: "MAESTRO-APK-GROUP-TRIP-1760 | Other | 12"
- tapOn:
    id: "bottom.pulse"

- takeScreenshot: stress_35_done
