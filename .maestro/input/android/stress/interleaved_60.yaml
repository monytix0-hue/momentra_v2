          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.apk.personal@test.com"
# Gboard first-run "Try out your stylus" coachmark covers password after wipe/cold boot.
