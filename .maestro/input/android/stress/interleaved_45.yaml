# Stress shard 45 — interleaved P/G/B (50 writable rows)
# Hard gate: pilot PASS required before running stress at scale

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding.skip"
    timeout: 30000
