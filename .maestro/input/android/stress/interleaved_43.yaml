- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.group"

# MTR-APK-2162 Group/Gift Pool/Contribution join=JOINED
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible:
        id: "qa.tile.contribute"
    commands:
      - tapOn:
          id: "qa.tile.contribute"
- runFlow:
    when:
      visible: "Contribute"
    commands:
      - tapOn: "Contribute"
- runFlow:
    when:
      visible:
        id: "group.expense.split.equal"
    commands:
      - tapOn:
          id: "group.expense.split.equal"
- runFlow:
    when:
      visible:
        id: "group.contribute.note"
    commands:
      - tapOn:
          id: "group.contribute.note"
      - eraseText
      - inputText: "MAESTRO-APK-GROUP-GIFT_POOL-2162 | Contribution | 29230.54"
- runFlow:
    when:
      visible:
        id: "group.contribute.amount"
    commands:
      - tapOn:
          id: "group.contribute.amount"
      - eraseText
      - inputText: "29230.54"
- runFlow:
    when:
      visible:
        id: "group.contribute.submit"
    commands:
      - tapOn:
          id: "group.contribute.submit"
      - extendedWaitUntil:
          notVisible:
            id: "group.contribute.submit"
          timeout: 45000
# Never unconditional back — exits the app to launcher on Android.
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "bottom.pulse"
    commands:
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-APK-GROUP-GIFT_POOL-2162 | Contr"
    commands:
      - assertVisible: "MAESTRO-APK-GROUP-GIFT_POOL-2162 | Contr"
- tapOn:
    id: "bottom.pulse"

