      visible:
        id: "group.expense.note"
    commands:
      - tapOn:
          id: "group.expense.note"
      - eraseText
      - inputText: "MAESTRO-APK-GROUP-GIFT_POOL-0599 | Gift Purchase | 652.33"
- runFlow:
    when:
      visible:
        id: "group.expense.amount"
    commands:
      - tapOn:
          id: "group.expense.amount"
      - eraseText
      - inputText: "652.33"
- runFlow:
    when:
      visible:
        id: "group.expense.submit"
    commands:
      - tapOn:
          id: "group.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "group.expense.submit"
          timeout: 45000
- back
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-APK-GROUP-GIFT_POOL-0599 | Gift "
    commands:
      - assertVisible: "MAESTRO-APK-GROUP-GIFT_POOL-0599 | Gift "
- tapOn:
    id: "bottom.pulse"

