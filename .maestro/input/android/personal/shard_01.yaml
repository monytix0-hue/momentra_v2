# Generated by generate-input-flows.ts — do not hand-edit
# rows=50 first=MTR-APK-0001 last=MTR-APK-0148
# Login baked from .env.maestro.local so Maestro Studio works without -e
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding.skip"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Step Inside"
    commands:
      - tapOn: "Step Inside"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: "qa.apk.personal@test.com"
# Gboard first-run "Try out your stylus" coachmark covers password after wipe/cold boot.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: "MaestroQa123"
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.personal"
- tapOn:
    id: "topbar.new_moment"
- runFlow:
    when:
      visible: "Life Operations"
    commands:
      - tapOn: "Life Operations"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: "Activate Life Operations.*"
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 40
    centerElement: true
- tapOn: "Activate Life Operations.*"
- runFlow:
    when:
      visible:
        id: "personal.setup.submit"
    commands:
      - tapOn:
          id: "personal.setup.submit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 120000
# moment=P1
# MTR-APK-0001 Personal/Life Operations/Groceries join=JOINED
- tapOn:
