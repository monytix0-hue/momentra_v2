    id: "bottom.quickadd"
- tapOn:
    id: "qa.tile.income"
- runFlow:
    when:
      visible:
        id: "personal.income.note"
    commands:
      - tapOn:
          id: "personal.income.note"
      - eraseText
      - inputText: "MAESTRO-APK-PERSONAL-LIFE_OPERATIONS-1606 | Repairs | 1618.23"
- runFlow:
    when:
      visible:
        id: "personal.income.amount"
    commands:
      - tapOn:
          id: "personal.income.amount"
      - eraseText
      - inputText: "1618.23"
- runFlow:
    when:
      visible:
        id: "personal.income.submit"
    commands:
      - tapOn:
          id: "personal.income.submit"
      - extendedWaitUntil:
          notVisible:
            id: "personal.income.submit"
          timeout: 45000
- back
- runFlow:
    when:
      visible:
        id: "bottom.activity"
    commands:
      - tapOn:
          id: "bottom.activity"
- runFlow:
    when:
      visible: "MAESTRO-APK-PERSONAL-LIFE_OPERATIONS-160"
    commands:
      - assertVisible: "MAESTRO-APK-PERSONAL-LIFE_OPERATIONS-160"
- tapOn:
    id: "bottom.pulse"

