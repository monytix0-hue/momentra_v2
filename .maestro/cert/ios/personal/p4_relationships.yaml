appId: resolvingpoint.momentra
tags: [cert, personal, p4, ios]
---
# Q1-P4 Relationships Master Certification
# type=RELATIONSHIP_CONNECTION theme=#E91E63
# PASS requires UI + API + DB + audit + event + outbox + projection + persist (see qa:verify)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_EMPTY_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_EMPTY_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.personal"
- takeScreenshot: cert_p4_empty
- tapOn:
    id: "topbar.new_moment"
- runFlow:
    when:
      visible: "Relationships"
    commands:
      - tapOn: "Relationships"
- takeScreenshot: cert_p4_setup
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Activate"
    commands:
      - tapOn: "Activate"
- runFlow:
    when:
      visible: "Create"
    commands:
      - tapOn: "Create"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- takeScreenshot: cert_p4_pulse
- tapOn:
    id: "bottom.moments"
- takeScreenshot: cert_p4_moments
- tapOn:
    id: "bottom.life"
- takeScreenshot: cert_p4_life
- tapOn:
    id: "bottom.memory"
- takeScreenshot: cert_p4_memory
- tapOn:
    id: "bottom.pulse"
- assertVisible:
    id: "bottom.pulse"

# Quick Add: Connection (PASS_CANDIDATE)
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Connection"
    commands:
      - tapOn: "Connection"
- takeScreenshot: cert_p4_qa_connection
- runFlow:
    when:
      visible:
        id: "personal.expense.submit"
    commands:
      - tapOn:
          id: "personal.expense.note"
      - eraseText
      - inputText: "MAESTRO-${MAESTRO_RUN_ID}-P4-Connection"
      - tapOn:
          id: "personal.expense.amount"
      - eraseText
      - inputText: "137.41"
      - tapOn:
          id: "personal.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "personal.expense.submit"
          timeout: 45000
- back


# Quick Add: Support (PASS_CANDIDATE)
- tapOn:
