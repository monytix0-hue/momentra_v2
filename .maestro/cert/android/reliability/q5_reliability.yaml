appId: com.example.momentra
tags: [cert, reliability, q5, android]
---
# Q5 Reliability / security
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_MULTI_CONTEXT_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_MULTI_CONTEXT_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.personal"
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Expense"
    commands:
      - tapOn: "Expense"
- extendedWaitUntil:
    visible:
      id: "personal.expense.submit"
    timeout: 30000
- tapOn:
    id: "personal.expense.note"
- eraseText
- inputText: "MAESTRO-${MAESTRO_RUN_ID}-DBL"
- tapOn:
    id: "personal.expense.amount"
- eraseText
- inputText: "42.00"
# Double submit — canonical row count must be 1 (qa:verify)
- tapOn:
    id: "personal.expense.submit"
- tapOn:
    id: "personal.expense.submit"
- extendedWaitUntil:
    notVisible:
      id: "personal.expense.submit"
    timeout: 60000
- takeScreenshot: cert_q5_double_submit
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- takeScreenshot: cert_q5_warm_launch
# Offline / 500 / PIN / biometric / deep-link: platform-specific subflows (document BLOCKED if unavailable)
