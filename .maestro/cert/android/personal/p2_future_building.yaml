- back

- tapOn:
    id: "bottom.pulse"
- takeScreenshot: cert_p2_after_writes
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- takeScreenshot: cert_p2_relaunch
# Backend proof (runner): npm run qa:verify -- --run-id $MAESTRO_RUN_ID --expect personal-expense --alias QA_EMPTY
