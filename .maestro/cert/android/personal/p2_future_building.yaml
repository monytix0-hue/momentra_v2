# Quick Add: Learning (PASS_CANDIDATE)
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Learning"
    commands:
      - tapOn: "Learning"
- takeScreenshot: cert_p2_qa_learning
- runFlow:
    when:
      visible:
        id: "personal.expense.submit"
    commands:
      - tapOn:
          id: "personal.expense.note"
      - eraseText
      - inputText: "MAESTRO-${MAESTRO_RUN_ID}-P2-Learning"
      - tapOn:
          id: "personal.expense.amount"
      - eraseText
      - inputText: "137.41"
      - tapOn:
