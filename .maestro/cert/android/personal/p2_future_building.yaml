    when:
      visible: "Progress"
    commands:
      - tapOn: "Progress"
- takeScreenshot: cert_p2_qa_progress
- runFlow:
    when:
      visible:
        id: "personal.expense.submit"
    commands:
      - tapOn:
          id: "personal.expense.note"
      - eraseText
      - inputText: "MAESTRO-${MAESTRO_RUN_ID}-P2-Progress"
      - tapOn:
