appId: com.example.momentra
tags: [cert, personal, p3, android]
---
# Q1-P3 Lifestyle Master Certification
# type=LIFESTYLE theme=#0EA5A4
# PASS requires UI + API + DB + audit + event + outbox + projection + persist (see qa:verify)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_EMPTY_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_EMPTY_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.personal"
- takeScreenshot: cert_p3_empty
- tapOn:
    id: "topbar.new_moment"
- runFlow:
    when:
      visible: "Lifestyle"
    commands:
      - tapOn: "Lifestyle"
- takeScreenshot: cert_p3_setup
- runFlow:
    when:
      visible:
        id: "setup.dropdown.vision.trigger"
    commands:
      - tapOn:
          id: "setup.dropdown.vision.trigger"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Activate"
    commands:
      - tapOn: "Activate"
- runFlow:
    when:
      visible: "Create"
    commands:
      - tapOn: "Create"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- takeScreenshot: cert_p3_pulse
- tapOn:
    id: "bottom.moments"
- takeScreenshot: cert_p3_moments
- tapOn:
    id: "bottom.life"
- takeScreenshot: cert_p3_life
- tapOn:
    id: "bottom.memory"
- takeScreenshot: cert_p3_memory
- tapOn:
    id: "bottom.pulse"
- assertVisible:
    id: "bottom.pulse"

# Quick Add: Experience (PASS_CANDIDATE)
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Experience"
    commands:
      - tapOn: "Experience"
- takeScreenshot: cert_p3_qa_experience
- runFlow:
    when:
      visible:
        id: "personal.expense.submit"
    commands:
      - tapOn:
          id: "personal.expense.note"
      - eraseText
      - inputText: "MAESTRO-${MAESTRO_RUN_ID}-P3-Experience"
      - tapOn:
          id: "personal.expense.amount"
      - eraseText
      - inputText: "137.41"
      - tapOn:
          id: "personal.expense.submit"
      - extendedWaitUntil:
          notVisible:
            id: "personal.expense.submit"
          timeout: 45000
- back


