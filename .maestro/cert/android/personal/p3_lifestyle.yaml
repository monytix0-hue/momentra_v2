# Quick Add: Adjust (PASS_CANDIDATE)
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Adjust"
    commands:
      - tapOn: "Adjust"
- takeScreenshot: cert_p3_qa_adjust
- runFlow:
    when:
      visible:
        id: "personal.expense.submit"
    commands:
      - tapOn:
