appId: com.example.momentra
tags: [cert, business, b02, android]
---
# Q3-B02 Business Runway
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_BUSINESS_OWNER_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_BUSINESS_OWNER_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.business"
- tapOn:
    id: "topbar.new_moment"
- runFlow:
    when:
      visible: "Business Runway"
    commands:
      - tapOn: "Business Runway"
- takeScreenshot: cert_b02_setup
- extendedWaitUntil:
    visible:
      id: "setup.title"
    timeout: 30000
- tapOn:
    id: "setup.title"
- eraseText
- inputText: "MAESTRO-${MAESTRO_RUN_ID}-B02-RUNWAY"
- scrollUntilVisible:
    element:
      id: "business.setup.submit"
    direction: DOWN
- tapOn:
    id: "business.setup.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- takeScreenshot: cert_b02_pulse
- tapOn:
    id: "bottom.moments"
- takeScreenshot: cert_b02_moments
- tapOn:
    id: "bottom.life"
- takeScreenshot: cert_b02_life
- tapOn:
    id: "bottom.memory"
- takeScreenshot: cert_b02_memory
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Expense"
    commands:
      - tapOn: "Expense"
- extendedWaitUntil:
    visible:
      id: "business.expense.amount"
    timeout: 30000
- tapOn:
    id: "business.expense.note"
- eraseText
- inputText: "MAESTRO-${MAESTRO_RUN_ID}-B02-EXP"
- tapOn:
    id: "business.expense.amount"
- eraseText
- inputText: "8713.22"
- tapOn:
    id: "business.expense.submit"
- extendedWaitUntil:
    notVisible:
      id: "business.expense.submit"
    timeout: 60000
- takeScreenshot: cert_b02_expense
# Revenue/Invoice/Approval: classify PASS_CANDIDATE or API_GAP/ANDROID_MISSING per catalog; execute when UI exists
