appId: com.example.momentra
tags: [cert, business, b00, android]
---
# Q3-B00 Company Setup
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding.skip"
    commands:
      - tapOn:
          id: "onboarding.skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "consent.continue"
    commands:
      - tapOn:
          id: "consent.continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_BUSINESS_OWNER_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_BUSINESS_OWNER_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.business"
- takeScreenshot: cert_b00_empty
- runFlow:
    when:
      visible: "Create Company"
    commands:
      - tapOn: "Create Company"
- runFlow:
    when:
      visible:
        id: "business.company.create"
    commands:
      - tapOn:
          id: "business.company.create"
- takeScreenshot: cert_b00_create
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Create"
    commands:
      - tapOn: "Create"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- assertVisible:
    id: "company.switcher"
- takeScreenshot: cert_b00_selected
- tapOn:
    id: "account.sign_out"
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 60000
- tapOn:
    id: "login.email"
- eraseText
- inputText: ${QA_BUSINESS_OWNER_EMAIL}
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${QA_BUSINESS_OWNER_PASSWORD}
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "bottom.pulse"
    timeout: 90000
- tapOn:
    id: "context.business"
- takeScreenshot: cert_b00_restored
