appId: resolvingpoint.momentra
name: Business Reality Seed V1 - 300 Quick Adds
---
- launchApp
- extendedWaitUntil:
    visible: "Pulse|Business|Momentra Multi Store QA"
    timeout: 20000
- tapOn:
    text: "Business"
    optional: true
- tapOn:
    text: "Momentra Multi Store QA"
    optional: true
- runScript: ../data/business_seed.js
- repeat:
    while:
      true: ${output.index < output.records.length}
    commands:
      - evalScript: ${output.r = output.records[output.index]}
      - runFlow:
          file: flows/business/add_record.yaml
          env:
            FAMILY: ${output.r.family}
            TYPE: ${output.r.type}
            TITLE: ${output.r.title}
            AMOUNT: ${output.r.amount}
            STORE: ${output.r.store}
            STATUS: ${output.r.status}
            NOTE: ${output.r.note}
            RECORD_DATE: ${output.r.date}
      - evalScript: ${output.index++}
- assertVisible: "Pulse|Moments|Life|Memory"
