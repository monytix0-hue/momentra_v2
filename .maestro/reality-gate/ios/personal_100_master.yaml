appId: resolvingpoint.momentra
name: Personal Reality Seed V1 - 100 Quick Adds
---
- launchApp
- extendedWaitUntil:
    visible: "Pulse|Personal"
    timeout: 20000
- tapOn:
    text: "Personal"
    optional: true
- runScript: ../data/personal_seed.js
- repeat:
    while:
      true: ${output.index < output.records.length}
    commands:
      - evalScript: ${output.r = output.records[output.index]}
      - runFlow:
          file: flows/personal/add_record.yaml
          env:
            FAMILY: ${output.r.family}
            TYPE: ${output.r.type}
            TITLE: ${output.r.title}
            AMOUNT: ${output.r.amount}
            CATEGORY: ${output.r.category}
            NOTE: ${output.r.note}
            RECORD_DATE: ${output.r.date}
            EXTRA: ${output.r.extra || ""}
      - evalScript: ${output.index++}
- assertVisible: "Pulse|Moments|Life|Memory"
