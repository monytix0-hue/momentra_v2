appId: com.example.momentra
name: Business Reality Seed chunk 24
---
- launchApp
- runFlow: flows/business/goto_business.yaml
- runScript: ../data/business_chunk_24.js
- evalScript: ${output.records = output.records.filter(function(r) { return ["Revenue","Expense"].indexOf(r.type) >= 0 })}
- repeat:
    while:
      true: ${output.index < output.records.length}
    commands:
      - evalScript: ${output.r = output.records[output.index]}
      - runFlow:
          file: flows/business/add_record.yaml
          env:
            FAMILY: ${output.r.family}
            TYPE: ${output.r.type}
            TITLE: ${output.r.title}
            AMOUNT: ${output.r.amount}
            STORE: ${output.r.store}
            STATUS: ${output.r.status}
            NOTE: ${output.r.note}
            RECORD_DATE: ${output.r.date}
      - evalScript: ${output.index++}
