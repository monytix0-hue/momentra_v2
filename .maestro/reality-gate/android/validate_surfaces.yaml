- tapOn: "Pulse"
- assertVisible: "Pulse"
- tapOn: "Moments"
- assertVisible: "Moments"
- tapOn: "Life"
- assertVisible: "Life"
- tapOn: "Memory"
- assertVisible: "Memory"
