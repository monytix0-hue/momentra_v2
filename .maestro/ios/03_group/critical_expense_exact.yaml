appId: resolvingpoint.momentra
tags: [critical, ios, group, finance, split]
---
# QA_GROUP_OWNER creates EXACT/Custom split expense; verifies on Pulse
- runFlow: ../00_auth/smoke_email_login_group.yaml
- tapOn:
    id: "context.group"
- tapOn:
    id: "bottom.quickadd"
- runFlow:
    when:
      visible: "Expense"
    commands:
      - tapOn: "Expense"
- extendedWaitUntil:
    visible:
      id: "group.expense.amount"
    timeout: 20000
- tapOn:
    id: "group.expense.note"
- eraseText
- inputText: "MAESTRO-EXACT-${MAESTRO_RUN_ID}"
- tapOn:
    id: "group.expense.amount"
- eraseText
- inputText: "100.00"
- runFlow:
    when:
      visible:
        id: "group.expense.split.exact"
    commands:
      - tapOn:
          id: "group.expense.split.exact"
- assertVisible: "Exact amount per person"
- tapOn:
    id: "group.expense.submit"
- extendedWaitUntil:
    notVisible:
      id: "group.expense.submit"
    timeout: 45000
- tapOn:
    id: "bottom.pulse"
- assertVisible: "MAESTRO-EXACT-${MAESTRO_RUN_ID}"
- takeScreenshot: ios_group_expense_exact
