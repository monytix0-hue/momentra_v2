appId: resolvingpoint.momentra
tags: [smoke, ios, auth]
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "onboarding.skip"
    timeout: 45000
    optional: true
- extendedWaitUntil:
    visible:
      id: "consent.continue"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    visible:
      id: "login.screen"
    timeout: 15000
    optional: true
