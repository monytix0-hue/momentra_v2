appId: resolvingpoint.momentra
---
# Physical iOS: Maestro 2.9 DeviceControlIOSDevice.launch() is still TODO
# ("Not yet implemented"). run-ios.sh launches the app with:
#   xcrun devicectl device process launch --terminate-existing …
# before this flow. Do not use launchApp / clearState / clearKeychain here.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
    optional: true
- extendedWaitUntil:
    visible: "Continue"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 5000
    optional: true
