openapi: 3.1.0
info:
  title: Momentra Health API
  version: 1.0.0
  description: Operational health endpoints (not under /v1).
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      tags: [Health]
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe
      tags: [Health]
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '503':
          description: Service not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [degraded]
