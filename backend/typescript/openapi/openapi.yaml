openapi: 3.1.0
info:
  title: Momentra API
  version: 1.0.0
  description: |
    SUPERSEDED — use openapi/momentra-v1.yaml (Phase 2 authoritative contract).
    This file remains for Mapping Freeze v4 reference only.
servers:
  - url: /v1
    description: API v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CommandEnvelope:
      type: object
      required: [data, correlationId]
      properties:
        data: {}
        resourceVersion:
          type: integer
        correlationId:
          type: string
          format: uuid
        projectionHints:
          type: array
          items:
            type: string
    ProjectionEnvelope:
      type: object
      required: [data, correlationId]
      properties:
        data: {}
        projectionVersion:
          type: integer
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
        nextCursor:
          type: string
          nullable: true
        correlationId:
          type: string
          format: uuid
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
        details: {}
    MeResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        firebaseUid:
          type: string
        roles:
          type: array
          items:
            type: string
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Bootstrap identity after Firebase sign-in
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommandEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MeResponse'
  /me/devices:
    post:
      summary: Register FCM device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken]
              properties:
                deviceId:
                  type: string
                  format: uuid
                platform:
                  type: string
                  enum: [ANDROID, IOS, WEB]
                pushToken:
                  type: string
                appVersion:
                  type: string
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /me/devices/{deviceId}:
    delete:
      summary: Revoke FCM device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /moments:
    post:
      summary: Create moment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [momentTypeCode, title]
              properties:
                domainCode:
                  type: string
                  enum: [PERSONAL, GROUP, BUSINESS]
                momentTypeCode:
                  type: string
                title:
                  type: string
                description:
                  type: string
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                timezone:
                  type: string
                customTypeLabel:
                  type: string
                expectedVersion:
                  type: integer
      responses:
        '201':
          description: Moment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /moments/{momentId}:
    get:
      summary: Get moment
      parameters:
        - name: momentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
    patch:
      summary: Update moment
      parameters:
        - name: momentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                title:
                  type: string
                description:
                  type: string
                expectedVersion:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /moments/{momentId}/archive:
    post:
      summary: Archive moment
      parameters:
        - name: momentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /moments/{momentId}/cancel:
    post:
      summary: Cancel moment
      parameters:
        - name: momentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /moments/{momentId}/expenses:
    post:
      summary: Record expense (EXPENSE_CREATE)
      parameters:
        - name: momentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currencyCode]
              properties:
                amount:
                  type: string
                currencyCode:
                  type: string
                description:
                  type: string
                merchantName:
                  type: string
                categoryCode:
                  type: string
                effectiveAt:
                  type: string
                  format: date-time
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
  /moments/{momentId}/tasks:
