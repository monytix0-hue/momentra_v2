components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token (Authorization Bearer)
  parameters:
    correlationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional client correlation ID; echoed in responses.
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    cursorQuery:
      name: cursor
      in: query
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    momentIdParam:
      name: momentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    deviceIdParam:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    pollIdParam:
      name: pollId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    companyIdParam:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    locationIdParam:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    uploadIdParam:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    actionProposalIdParam:
      name: actionProposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: object
      required:
        - amount
        - currencyCode
      properties:
        amount:
          type: string
          description: Decimal string (maps to PostgreSQL NUMERIC). Never a JSON number.
          pattern: ^[0-9]+(\.[0-9]{1,4})?$
          example: "1250.50"
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          example: INR
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - correlationId
      description: Flat error envelope (authoritative — matches Node errorHandler).
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - GOVERNANCE_DENIED
            - RESOURCE_NOT_FOUND
            - VERSION_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - APPROVAL_REQUIRED
            - CONSENT_REQUIRED
            - SETTLEMENT_EXCEEDS_OUTSTANDING
            - INFRASTRUCTURE_UNAVAILABLE
            - RATE_LIMITED
        message:
          type: string
        correlationId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
    CommandEnvelope:
      type: object
      required:
        - data
        - correlationId
      properties:
        data: {}
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
        correlationId:
          type: string
          format: uuid
        projectionHints:
          type: array
          items:
            type: object
            required:
              - projection
              - action
            properties:
              projection:
                type: string
                description: Stable public projection code (not a DB object name).
                enum:
                  - personal.pulse
                  - personal.moments
                  - personal.life
                  - personal.memory
                  - personal.activity
                  - group.moments
                  - group.pulse
                  - business.moments
                  - business.pulse
                  - business.finance
              action:
                type: string
                enum:
                  - invalidate
                  - refresh
    ProjectionEnvelope:
      type: object
      required:
        - data
        - correlationId
      properties:
        data: {}
        projectionVersion:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - OK
            - STALE
            - EMPTY
        nextCursor:
          type: string
          nullable: true
        correlationId:
          type: string
          format: uuid
    MeResponse:
      type: object
      required:
        - userId
        - firebaseUid
        - supportedContexts
        - currentlySelectedContext
        - activeMoments
        - companies
        - preferences
        - featureFlags
        - capabilities
        - roles
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        firebaseUid:
          type: string
        timezone:
          type: string
        locale:
          type: string
          nullable: true
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
          description: Capability wire codes for the actor (V019 + baseline shell codes)
        supportedContexts:
          type: array
          items:
            type: string
            enum:
              - PERSONAL
              - GROUP
              - BUSINESS
              - CIRCLE
        currentlySelectedContext:
          type: string
          enum:
            - PERSONAL
            - GROUP
            - BUSINESS
            - CIRCLE
          description: Server default; client may overlay locally persisted last selection
        activeMoments:
          type: object
          required:
            - personal
            - group
            - business
          properties:
            personal:
              type: array
              items:
                $ref: "#/components/schemas/MeResponse/properties/activeMoments/properties/grou\
                  p/items"
            group:
              type: array
              items:
                type: object
                required:
                  - momentId
                  - title
                  - status
                  - domainCode
                properties:
                  momentId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  status:
                    type: string
                  momentTypeCode:
                    type: string
                    nullable: true
                  domainCode:
                    type: string
                    enum:
                      - PERSONAL
                      - GROUP
                      - BUSINESS
            business:
              type: array
              items:
                $ref: "#/components/schemas/MeResponse/properties/activeMoments/properties/grou\
                  p/items"
        companies:
          type: array
          items:
            type: object
            required:
              - companyId
              - displayName
            properties:
              companyId:
                type: string
                format: uuid
              displayName:
                type: string
        selectedCompany:
          allOf:
            - $ref: "#/components/schemas/MeResponse/properties/companies/items"
          nullable: true
        preferences:
          type: object
          required:
            - timezone
          properties:
            timezone:
              type: string
            locale:
              type: string
              nullable: true
        featureFlags:
          type: object
          additionalProperties:
            oneOf:
              - type: boolean
              - type: string
              - type: number
    MomentCreateRequest:
      type: object
      required:
        - momentTypeCode
        - title
      properties:
        domainCode:
          type: string
          enum:
            - PERSONAL
            - GROUP
            - BUSINESS
        momentTypeCode:
          type: string
          description: V018 wire code (not Figma display label). GROUP SHARED_EXPERIENCE
            uses TRIP, WEDDING, HOUSE_PARTY, OFFICE_OUTING.
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 5000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timezone:
          type: string
          default: UTC
        customTypeLabel:
          type: string
          maxLength: 500
        companyId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        participants:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
              displayName:
                type: string
                maxLength: 200
              roleCode:
                type: string
                enum:
                  - ORGANIZER
                  - CO_ORGANIZER
                  - PARTICIPANT
                  - RESIDENT
                  - CONTRIBUTOR
                  - OBSERVER
                default: PARTICIPANT
          description: Optional invitees for GROUP create. displayName creates an external
            party when userId is omitted.
        personalSetup:
          type: object
          required:
            - systemCode
          properties:
            systemCode:
              type: string
              enum:
                - LIFE_OPERATIONS
                - FUTURE_BUILDING
                - LIFESTYLE
                - RELATIONSHIPS
            preferences:
              type: object
              additionalProperties: true
              description: Validated per systemCode server-side against catalog keys.
        businessSetup:
          type: object
          required:
            - familyCode
          properties:
            familyCode:
              type: string
              enum:
                - TEAM_OPERATIONS
                - BUSINESS_RUNWAY
                - BUSINESS_OPERATIONS
            preferences:
              type: object
              additionalProperties: true
              description: Validated per familyCode server-side against catalog keys.
                companyId is authoritative at request root.
    ExpenseCreateRequest:
      type: object
      required:
        - amount
        - currencyCode
      properties:
        amount:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,4})?$
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: string
          maxLength: 500
        merchantName:
          type: string
        categoryCode:
          type: string
        financialAccountId:
          type: string
          format: uuid
          description: Optional paid-from financial account (Personal).
        effectiveAt:
          type: string
          format: date-time
        splits:
          type: array
          items:
            type: object
            required:
              - strategy
            properties:
              participantId:
                type: string
                format: uuid
              strategy:
                type: string
                enum:
                  - EQUAL
                  - EXACT
                  - PERCENTAGE
                  - SHARES
              amount:
                type: string
              percentage:
                type: string
              shares:
                type: integer
    PollResponse:
      type: object
      required:
        - pollId
        - momentId
        - question
        - status
      properties:
        pollId:
          type: string
          format: uuid
        momentId:
          type: string
          format: uuid
        question:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - OPEN
            - CLOSED
            - CANCELLED
        pollType:
          type: string
        closesAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
          description: User who created the poll
        canClose:
          type: boolean
          description: Whether the current caller may close this poll (creator, organizer, or admin; false when not OPEN)
        options:
          type: array
          items:
            type: object
            properties:
              pollOptionId:
                type: string
                format: uuid
              text:
                type: string
              optionText:
                type: string
              sortOrder:
                type: integer
              voteCount:
                type: integer
              votedByMe:
                type: boolean
    CompanyLocationResponse:
      type: object
      required:
        - companyLocationId
        - companyId
        - name
        - status
        - version
      properties:
        companyLocationId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
        addressText:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        status:
          type: string
        version:
          type: integer
    ActivityItem:
      type: object
      required:
        - activityId
        - kind
        - occurredAt
      properties:
        activityId:
          type: string
          format: uuid
        kind:
          type: string
          description: Discriminator for activity type (expense, milestone, mood, etc.).
        title:
          type: string
        occurredAt:
          type: string
          format: date-time
        momentId:
          type: string
          format: uuid
          nullable: true
