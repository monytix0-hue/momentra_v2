openapi: 3.1.0
info:
  title: Momentra API
  version: 1.0.0
  description: >
    Authoritative /v1 transport contract (Phase 2 freeze).

    PostgreSQL is canonical truth; this spec defines HTTP transport only.

    Work and Finance commands are moment-scoped (single canonical engines).

    Group context uses GROUP-domain moments — no separate /groups CRUD entity.

    Circle full CRUD is CONTRACT_DEFERRED; GET /life360 is the Circle read
    projection.
servers:
  - url: /v1
    description: Product API
paths:
  /ai/action-proposals/{actionProposalId}/execute:
    post:
      operationId: executeActionProposal
      summary: Execute AI action proposal
      tags:
        - AI
      x-momentra-kind: command
      x-momentra-impl: IMPLEMENTED
      x-momentra-idempotency: required
      parameters:
        - $ref: "#/components/parameters/actionProposalIdParam"
        - $ref: "#/components/parameters/idempotencyKeyHeader"
        - $ref: "#/components/parameters/correlationIdHeader"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelope"
        "400":
          $ref: "#/paths/~1me/get/responses/400"
        "401":
